<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background squircle gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF5F8" />
      <stop offset="100%" stop-color="#FFE4EE" />
    </radialGradient>

    <!-- Puffy Bubble Pink Gradient -->
    <linearGradient id="bubblePink" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FF5C9D" />
      <stop offset="45%" stop-color="#FF2E7E" />
      <stop offset="100%" stop-color="#D91663" />
    </linearGradient>

    <!-- Star Charm Gold Gradient -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Star Charm Lavender Gradient -->
    <linearGradient id="charmPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Heart Charm Gradient -->
    <linearGradient id="heartPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9E" />
      <stop offset="100%" stop-color="#FF1F68" />
    </linearGradient>

    <!-- 3D Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#18181B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Squircle Container (Looks gorgeous in both Dark and Light browser tabs) -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="#18181B" stroke-width="4.5" />

  <!-- Dangle Keychain Charm Loop on the Left -->
  <g id="keychain" stroke="#18181B" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clasp Ring -->
    <ellipse cx="26" cy="50" rx="6.5" ry="11" fill="none" stroke="#94A3B8" stroke-width="3" />
    <ellipse cx="26" cy="50" rx="6.5" ry="11" fill="none" stroke="#18181B" stroke-width="3" stroke-dasharray="16 25" />
    
    <!-- Dangling Chain Links -->
    <path d="M 26 61 C 24 67, 21 73, 23 80" fill="none" stroke="#64748B" stroke-width="2.5" />
    
    <!-- Mini Purple Star Charm -->
    <path d="M 18 84 L 20 89 L 25 89.5 L 21 93 L 22.5 98 L 18 95 L 13.5 98 L 15 93 L 11 89.5 L 16 89 Z"
          fill="url(#charmPurple)" stroke="#18181B" stroke-width="2.2" />

    <!-- Mini 8-Ball Charm -->
    <circle cx="34" cy="94" r="8.5" fill="#18181B" />
    <circle cx="34" cy="94" r="4" fill="#FFFFFF" />
    <text x="34" y="96.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="900" text-anchor="middle" fill="#18181B">8</text>

    <!-- Mini Heart Charm -->
    <path d="M 23 103 C 23 99, 18 98, 16 102 C 14 98, 9 99, 9 103 C 9 108, 16 113, 16 113 C 16 113, 23 108, 23 103 Z"
          fill="url(#heartPink)" stroke="#18181B" stroke-width="2" />
  </g>

  <!-- Puffy Bubble 'b' Monogram with Drop Shadow -->
  <g filter="url(#softShadow)">
    <!-- Main 'b' Bubble Body Outline & Fill -->
    <path d="M 46 22
             C 38 22, 34 29, 35 39
             L 37 63
             C 39 57, 46 54, 54 54
             C 71 54, 85 64, 85 81
             C 85 97, 70 109, 52 109
             C 38 109, 31 100, 31 90
             L 31 38
             C 31 23, 40 16, 50 16
             C 55 16, 57 19, 57 23
             C 57 26, 54 28, 49 28
             Z"
          fill="url(#bubblePink)"
          stroke="#18181B"
          stroke-width="5"
          stroke-linejoin="round" />

    <!-- Inner 'b' Hole / Counter -->
    <path d="M 52 68
             C 61 68, 68 74, 68 82
             C 68 89, 61 95, 52 95
             C 45 95, 41 89, 41 82
             C 41 74, 45 68, 52 68 Z"
          fill="#FFF5F8"
          stroke="#18181B"
          stroke-width="4.5" />

    <!-- Glossy Curved Highlights (Creates the juicy 3D bubble effect) -->
    <!-- Top-left stem highlight -->
    <path d="M 39 30 C 37 36, 37 48, 38 56"
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

    <!-- Bottom bubble curve highlight -->
    <path d="M 48 61 C 62 61, 74 69, 74 79"
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
          
    <ellipse cx="73" cy="88" rx="2.5" ry="4" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Y2K Retro Sparkle Stars (Top Right & Bottom Right) -->
  <!-- Gold Sparkle Top Right -->
  <path d="M 102 24 C 102 31, 107 34, 114 34 C 107 34, 102 37, 102 44 C 102 37, 97 34, 90 34 C 97 34, 102 31, 102 24 Z"
        fill="url(#starGold)" stroke="#18181B" stroke-width="2.5" />

  <!-- Mini Black Accent Sparkle -->
  <path d="M 94 54 C 94 57, 96 58, 99 58 C 96 58, 94 59, 94 62 C 94 59, 92 58, 89 58 C 92 58, 94 57, 94 54 Z"
        fill="#18181B" />
</svg>

